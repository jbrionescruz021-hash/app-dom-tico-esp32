# Blueprint de Render: crea el servicio web automáticamente desde el repo.
# En Render: New → Blueprint → selecciona este repositorio.
services:
  - type: web
    name: app-domotico-esp32
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        generateValue: true   # Render genera una clave segura; cópiala a config.h
      - key: CONTROL_PIN
        sync: false           # PIN que se pide en el dashboard para usar los interruptores
      # Opcional: para guardar el historial de forma permanente,
      # crea una base Postgres y pega aquí su "Internal Database URL".
      # - key: DATABASE_URL
      #   sync: false
